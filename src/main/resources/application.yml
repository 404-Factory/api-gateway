server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: reciperecommendationai-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/ai/recipe/**
            - Path=/api/internal/recipe/**

        - id: anomaly-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/anomalies/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/alerts/**

        - id: chatbot-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/chat/**

        - id: management-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/equipments/**
          filters:
            - RewritePath=/api/equipments/(?<segment>.*), /equipments/$\{segment}

        - id: summary-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/summary/**